#-------- General Settings --------
set -g mouse on
set-window-option -g mode-keys vi
set -g history-limit 12000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

#-------- prefix key --------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -------- Status Bar --------
set -g status-interval 10
